name: dart_pubdev_mcp
description: >-
  Model Context Protocol (MCP) server for pub.dev. Gives AI agents structured
  access to search, compare, evaluate, and inspect Dart and Flutter packages.
version: 0.6.1
homepage: https://github.com/PhilippHGerber/agentic_dart
repository: https://github.com/PhilippHGerber/agentic_dart/tree/main/packages/dart_pubdev_mcp
issue_tracker: https://github.com/PhilippHGerber/agentic_dart/issues
resolution: workspace

topics:
  - mcp
  - pub-dev
  - dart
  - ai
  - flutter

environment:
  sdk: ">=3.9.0 <4.0.0"

executables:
  dart-pubdev-explorer: dart_pubdev_mcp

dependencies:
  analyzer: ^14.1.0
  archive: ^4.0.9
  cli_config: ^0.2.0
  dart_mcp: ^0.5.2
  html: ^0.15.6
  http: ^1.6.0

dev_dependencies:
  build_runner: ^2.15.0
  build_version: ^2.1.3
  coverage: ^1.15.0
  mocktail: ^1.0.0
  stream_channel: ^2.1.4
  test: ^1.24.0
  very_good_analysis: ^10.2.0
  yaml: ^3.1.2

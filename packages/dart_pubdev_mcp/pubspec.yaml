name: dart_pubdev_mcp
description: >-
  Model Context Protocol (MCP) server for pub.dev, Dart SDK, and Flutter.
  Gives AI agents live package search, API docs,
  AST source slices, and breaking change diffs.
version: 0.10.0
homepage: https://github.com/PhilippHGerber/agentic_dart
repository: https://github.com/PhilippHGerber/agentic_dart/tree/main/packages/dart_pubdev_mcp
issue_tracker: https://github.com/PhilippHGerber/agentic_dart/issues
resolution: workspace

topics:
  - mcp
  - pub-dev
  - flutter
  - dart
  - ai

environment:
  sdk: ">=3.9.0 <4.0.0"

executables:
  dart-pubdev-explorer: dart_pubdev_mcp

dependencies:
  analyzer: ^14.1.0
  archive: ^4.2.0
  cli_config: ^0.2.0
  dart_mcp: ^0.5.2
  html: ^0.15.6
  http: ^1.6.0
  pub_semver: ^2.2.0

dev_dependencies:
  build_runner: ^2.16.0
  build_version: ^2.1.3
  coverage: ^1.15.1
  mocktail: ^1.0.5
  stream_channel: ^2.1.4
  test: ^1.31.2
  very_good_analysis: ^11.0.0
  yaml: ^3.1.3
